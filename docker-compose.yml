services:
  slicer-worker:
    build:
      context: .
      dockerfile: apps/slicer-worker/Dockerfile
    image: baski-ciftligi-slicer-worker:2.8.1
    env_file:
      - path: .env.local
        required: false
    read_only: true
    tmpfs:
      - /tmp
      - /home/slicer
    environment:
      APP_BASE_URL: http://host.docker.internal:3000
      SLICER_WORKER_SECRET: ${SLICER_WORKER_SECRET:-dev-slicer-worker-secret-not-for-production}
      SLICER_WORKER_ID: local-docker
      PORT: "8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8788:8788"
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
