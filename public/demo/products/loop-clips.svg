  </g>
  <g transform="rotate(11 427 467)">
    <rect x="341" y="223" width="172" height="488" rx="86" fill="url(#loop-ivory)"/>
    <rect x="388" y="279" width="78" height="363" rx="39" fill="#151A1E"/>
    <path d="M427 631v105" stroke="#EEE9DD" stroke-width="19" stroke-linecap="round"/>
  </g>
  <g transform="rotate(27 587 520)">
    <rect x="515" y="342" width="144" height="356" rx="72" fill="url(#loop-warm)"/>
    <rect x="554" y="389" width="66" height="244" rx="33" fill="#151A1E"/>
    <path d="M587 626v89" stroke="#FF9A5B" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
